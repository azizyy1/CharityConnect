about.title=About CharityConnect
about.mission.title=Our Mission
about.mission.text1=CharityConnect is a modern platform designed to bridge the gap between compassionate donors and impactful non-profit organizations. Our mission is to facilitate transparent, easy, and meaningful giving to support youth empowerment and social change worldwide.
about.mission.text2=We believe that every small contribution can lead to a significant difference. By providing a secure and intuitive interface, we empower everyone to become a part of the solution to today's most pressing challenges.
about.role.donors.title=For Donors
about.role.donors.text=Discover vetted causes, track your impact, and manage your contributions in one personal dashboard.
about.role.orgs.title=For Organizations
about.role.orgs.text=Launch campaigns, manage volunteers, and reach a wider community of supporters to fuel your mission.
about.role.transparency.title=Transparency
about.role.transparency.text=Real-time progress tracking and verified organizational status ensure that every dollar goes where it's needed.

