<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donation Campaigns - CharityConnect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/actions.css}">
</head>
<body>

<header>
    <a th:href="@{/}" class="logo">CharityConnect</a>
    <nav>
        <a th:href="@{/}" class="nav-link"><i class="fas fa-home"></i> Home</a>
        <th:block th:if="${#authorization.expression('isAuthenticated()')}">
            <th:block th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
                <a th:href="@{/admin/dashboard}" class="btn-dashboard">Dashboard</a>
            </th:block>
            <th:block th:if="${#authorization.expression('hasRole(''ORGANIZATION'')')}">
                <a th:href="@{/organization/dashboard}" class="btn-dashboard">Dashboard</a>
                <a th:href="@{/organization/profile}" title="Profile" style="color: var(--text-dark); font-size: 20px; margin-left: 20px;">
                    <i class="fas fa-building"></i>
                </a>
            </th:block>
            <th:block th:if="${#authorization.expression('hasRole(''USER'')')}">
                <a th:href="@{/user/dashboard}" class="btn-dashboard">Dashboard</a>
                <a th:href="@{/user/profile}" title="Profile" style="color: var(--text-dark); font-size: 20px; margin-left: 20px;">
                    <i class="fas fa-user-circle"></i>
                </a>
            </th:block>
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button type="submit" class="btn-logout" style="background: none; border: none; cursor: pointer; color: var(--text-dark); font-weight: 500; font-size: 16px; margin-left: 30px; transition: 0.3s; font-family: inherit;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </form>
        </th:block>
        <th:block th:unless="${#authorization.expression('isAuthenticated()')}">
            <a th:href="@{/login}"><i class="fas fa-sign-in-alt"></i> Login</a>
        </th:block>
    </nav>
</header>

<div class="container">
    <div class="page-header">
        <h1>Current Donation Campaigns</h1>
        <p>Help us make a difference by supporting these causes</p>
    </div>

    <div class="search-bar">
        <form th:action="@{/actions}" method="get">
            <input type="text" name="category" placeholder="Search by category (e.g. Education)">
            <button type="submit" class="btn-filter">Filter</button>
        </form>
        <form th:action="@{/actions}" method="get">
            <input type="text" name="keyword" placeholder="Search by keyword...">
            <button type="submit" class="btn-filter">Search</button>
        </form>
    </div>

    <div class="action-grid">
        <div th:each="action : ${actions}" class="action-card">
            <div class="card-image">
                <img th:src="${action.image != null && !action.image.isEmpty() ? action.image : 'https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'}" alt="Action Image">
            </div>
            <div class="card-content">
                <span class="card-category" th:text="${action.category}">Category</span>
                <h2 class="card-title" th:text="${action.title}">Action Title</h2>
                
                <div class="card-progress">
                    <div class="progress-bar">
                        <div class="progress-fill" th:style="'width: ' + ${ (action.targetAmount.signum() == 0) ? 0 : (action.collectedAmount.multiply(new java.math.BigDecimal(100)).divide(action.targetAmount, 0, T(java.math.RoundingMode).FLOOR)) } + '%'"></div>
                    </div>
                    <div class="progress-text">
                        <span th:text="${#numbers.formatDecimal(action.collectedAmount, 1, 'WHITESPACE', 0, 'POINT') + ' DH'}">0 DH</span>
                        <span th:text="${ (action.targetAmount.signum() == 0) ? 0 : (action.collectedAmount.multiply(new java.math.BigDecimal(100)).divide(action.targetAmount, 0, T(java.math.RoundingMode).FLOOR)) } + '%'">0%</span>
                    </div>
                </div>

                <a th:href="@{/actions/{id}(id=${action.id})}" class="btn-details">View Details</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
