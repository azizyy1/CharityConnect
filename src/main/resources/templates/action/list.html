<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{actions.list.title}, ~{::link})}">
    <link rel="stylesheet" th:href="@{/css/actions.css}">
</head>
<body>

<header th:replace="~{fragments/layout :: header(false)}"></header>

<div class="container">
    <div class="page-header">
        <h1 th:text="#{actions.list.title}">Current Donation Campaigns</h1>
        <p th:text="#{actions.list.subtitle}">Help us make a difference by supporting these causes</p>
    </div>

    <div class="search-bar">
        <form th:action="@{/actions}" method="get">
            <input type="text" name="category" th:placeholder="#{actions.list.search.category}">
            <button type="submit" class="btn-filter" th:text="#{actions.list.filter}">Filter</button>
        </form>
        <form th:action="@{/actions}" method="get">
            <input type="text" name="keyword" th:placeholder="#{actions.list.search.keyword}">
            <button type="submit" class="btn-filter" th:text="#{actions.list.search}">Search</button>
        </form>
    </div>

    <div class="action-grid">
        <div th:each="action : ${actions}" class="action-card">
            <div class="card-image">
                <img th:src="${action.image != null && !action.image.isEmpty() ? action.image : 'https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'}" alt="Action Image" onerror="this.src='https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'">
            </div>
            <div class="card-content">
                <span class="card-category" th:text="${@categoryLabelService.resolve(action.category, #locale)}">Category</span>
                <h2 class="card-title" th:text="${#messages.msgOrNull('demo.action.' + action.title.toLowerCase().split(' ')[0] + '.title') ?: action.title}">Action Title</h2>
                
                <div class="card-progress">
                    <div class="progress-bar">
                        <div class="progress-fill" th:style="'width: ' + ${ (action.targetAmount == null || action.targetAmount.signum() == 0) ? 0 : ((action.collectedAmount ?: 0).multiply(new java.math.BigDecimal(100)).divide(action.targetAmount, 0, T(java.math.RoundingMode).FLOOR)) } + '%'"></div>
                    </div>
                    <div class="progress-text">
                        <span th:text="${#numbers.formatDecimal(action.collectedAmount ?: 0, 1, 'WHITESPACE', 0, 'POINT') + ' DH'}">0 DH</span>
                        <span th:text="${ (action.targetAmount == null || action.targetAmount.signum() == 0) ? 0 : ((action.collectedAmount ?: 0).multiply(new java.math.BigDecimal(100)).divide(action.targetAmount, 0, T(java.math.RoundingMode).FLOOR)) } + '%'">0%</span>
                    </div>
                </div>

                <a th:href="@{/actions/{id}(id=${action.id})}" class="btn-details" th:text="#{actions.list.view_details}">View Details</a>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
