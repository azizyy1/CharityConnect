<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${action.title + ' - CharityConnect'}">Action Details</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/details.css}">
</head>
<body>

<header>
    <a th:href="@{/}" class="logo">CharityConnect</a>
    <nav>
        <a th:href="@{/}" class="nav-link"><i class="fas fa-home"></i> Home</a>
        <th:block th:if="${#authorization.expression('isAuthenticated()')}">
            <th:block th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
                <a th:href="@{/admin/dashboard}" class="btn-dashboard">Dashboard</a>
            </th:block>
            <th:block th:if="${#authorization.expression('hasRole(''ORGANIZATION'')')}">
                <a th:href="@{/organization/dashboard}" class="btn-dashboard">Dashboard</a>
                <a th:href="@{/organization/profile}" title="Profile" style="color: var(--text-dark); font-size: 20px; margin-left: 20px;">
                    <i class="fas fa-building"></i>
                </a>
            </th:block>
            <th:block th:if="${#authorization.expression('hasRole(''USER'')')}">
                <a th:href="@{/user/dashboard}" class="btn-dashboard">Dashboard</a>
                <a th:href="@{/user/profile}" title="Profile" style="color: var(--text-dark); font-size: 20px; margin-left: 20px;">
                    <i class="fas fa-user-circle"></i>
                </a>
            </th:block>
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button type="submit" class="btn-logout" style="background: none; border: none; cursor: pointer; color: var(--text-dark); font-weight: 500; font-size: 16px; margin-left: 30px; transition: 0.3s; font-family: inherit;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </form>
        </th:block>
        <th:block th:unless="${#authorization.expression('isAuthenticated()')}">
            <a th:href="@{/login}"><i class="fas fa-sign-in-alt"></i> Login</a>
        </th:block>
    </nav>
</header>

<div class="container">
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${param.participated}" class="alert alert-success">
        <i class="fas fa-check-circle"></i> Merci, votre participation a été enregistrée.
    </div>

    <div class="action-header">
        <div class="action-image">
            <img th:src="${action.image != null && !action.image.isEmpty() ? action.image : 'https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'}" alt="Action Image">
        </div>
        <div class="action-info-main">
            <span class="category-badge" th:text="${action.category}">Category</span>
            <h1 class="action-title" th:text="${action.title}">Action Title</h1>
            
            <div class="action-meta">
                <div><i class="fas fa-map-marker-alt"></i> <span th:text="${action.location}">Location</span></div>
                <div><i class="fas fa-calendar-alt"></i> <span th:text="${action.startDate}">Date</span></div>
            </div>

            <div class="progress-section">
                <div class="progress-stats">
                    <div>
                        <span class="collected-amount" th:text="${#numbers.formatDecimal(action.collectedAmount, 1, 'WHITESPACE', 2, 'POINT') + ' DH'}">0.00 DH</span>
                        <span class="target-amount" th:text="' raised of ' + ${#numbers.formatDecimal(action.targetAmount, 1, 'WHITESPACE', 2, 'POINT') + ' DH'}">0.00 DH</span>
                    </div>
                    <div th:text="${progress + '%'}">0%</div>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" th:style="'width: ' + ${progress} + '%'"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="action-details-grid">
        <div class="main-content">
            <div class="content-card">
                <h2 class="card-title">About this campaign</h2>
                <div class="description-text" th:text="${action.description}">
                    Campaign description goes here...
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="sidebar-card">
                <h3 class="card-title">Make a Donation</h3>
                <form th:action="@{/actions/{id}/donate(id=${action.id})}" method="post" class="donation-form">
                    <div class="form-group">
                        <label style="display: block; margin-bottom: 8px; font-weight: 500;">Amount (DH)</label>
                        <input type="number" name="amount" min="1" step="0.01" value="10.00" required>
                    </div>
                    <button type="submit" class="btn-action btn-primary">
                        <i class="fas fa-heart"></i> Donate Now
                    </button>
                </form>
            </div>

            <div class="sidebar-card">
                <h3 class="card-title">Volunteer</h3>
                <form th:action="@{/actions/{id}/participate(id=${action.id})}" method="post">
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 500;">Add a note (optional)</label>
                        <input type="text" name="note" maxlength="1000" placeholder="Why do you want to join?">
                    </div>
                    <button type="submit" class="btn-action btn-primary" style="background-color: var(--secondary-color);">
                        <i class="fas fa-hands-helping"></i> Sign Up to Help
                    </button>
                </form>
            </div>

            <div class="sidebar-card">
                <h3 class="card-title">Organizer</h3>
                <div class="org-card">
                    <div class="org-icon">
                        <i class="fas fa-university"></i>
                    </div>
                    <div>
                        <div style="font-weight: bold;" th:text="${action.organization.name}">Organization Name</div>
                        <div style="font-size: 14px; color: #777;">Verified Partner</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
