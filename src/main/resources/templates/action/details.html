<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Détails action</title>
</head>
<body>
<h1 th:text="${action.title}">Titre</h1>
<p th:text="${action.description}">Description</p>
<p>Catégorie: <span th:text="${action.category}"></span></p>
<p>Lieu: <span th:text="${action.location}"></span></p>
<p>Collecté: <span th:text="${action.collectedAmount}"></span> / <span th:text="${action.targetAmount}"></span></p>
<p>Progression: <span th:text="${progress}"></span>%</p>

<p th:if="${param.donated}">Merci, votre don simulé a été enregistré.</p>

<form th:action="@{/actions/{id}/donate(id=${action.id})}" method="post">
  <label>Montant du don:</label>
  <input type="number" name="amount" min="1" step="0.01" required>
  <button type="submit">Faire un don</button>
</form>

<p><a th:href="@{/actions}">Retour à la liste</a></p>
</body>
</html>
