<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Volunteer Registration', ~{::style})}">
    <style>
        .form-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .form-header {
            margin-bottom: 30px;
            text-align: center;
        }
        .form-header h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        .form-group textarea {
            height: 120px;
            resize: vertical;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-submit:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<header th:replace="~{fragments/layout :: header(false)}"></header>

<div class="container">
    <div class="form-container">
        <div class="form-header">
            <h1>Volunteer Registration</h1>
            <p th:text="'Sign up to help with: ' + ${action.title}"></p>
        </div>

        <form th:action="@{/actions/{id}/participate(id=${action.id})}" method="post">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" th:value="${user.firstName + ' ' + user.lastName}" readonly>
            </div>

            <div class="form-group">
                <label for="email">Email Address for Confirmation</label>
                <input type="email" id="email" name="email" th:value="${user.email}" placeholder="Where should we send the confirmation email?" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" th:value="${user.phone}" placeholder="Your phone number">
            </div>

            <div class="form-group">
                <label for="note">Why do you want to join? (Optional)</label>
                <textarea id="note" name="note" placeholder="Tell us about your motivation or any relevant experience..."></textarea>
            </div>

            <button type="submit" class="btn-submit">
                Submit Registration
            </button>
        </form>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
