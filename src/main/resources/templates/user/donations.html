<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Donations - CharityConnect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/user-donations.css}">
</head>
<body>

<header>
    <a th:href="@{/}" class="logo">CharityConnect</a>
    <nav>
        <a th:href="@{/}" class="nav-link"><i class="fas fa-home"></i> Home</a>
        <a th:href="@{/actions}" class="nav-link"><i class="fas fa-search"></i> Donations</a>
        <th:block th:if="${#authorization.expression('isAuthenticated()')}">
            <th:block th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
                <a th:href="@{/admin/dashboard}" class="btn-dashboard">Dashboard</a>
            </th:block>
            <th:block th:if="${#authorization.expression('hasRole(''ORGANIZATION'')')}">
                <a th:href="@{/organization/dashboard}" class="btn-dashboard">Dashboard</a>
                <a th:href="@{/organization/profile}" title="Profile" style="color: var(--text-dark); font-size: 20px; margin-left: 20px;">
                    <i class="fas fa-building"></i>
                </a>
            </th:block>
            <th:block th:if="${#authorization.expression('hasRole(''USER'')')}">
                <a th:href="@{/user/dashboard}" class="btn-dashboard">Dashboard</a>
                <a th:href="@{/user/profile}" title="Profile" style="color: var(--text-dark); font-size: 20px; margin-left: 20px;">
                    <i class="fas fa-user-circle"></i>
                </a>
            </th:block>
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button type="submit" class="btn-logout" style="background: none; border: none; cursor: pointer; color: var(--text-dark); font-weight: 500; font-size: 16px; margin-left: 30px; transition: 0.3s; font-family: inherit;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </form>
        </th:block>
    </nav>
</header>

    <div class="main-content">
        <a th:href="@{/user/dashboard}" class="nav-back">
            <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>

        <div class="header">
            <h1>My Donation History</h1>
        </div>

        <div class="card">
            <div th:if="${#lists.isEmpty(donations)}" class="empty-state">
                <i class="fas fa-hand-holding-usd"></i>
                <p>You haven't made any donations yet.</p>
                <a th:href="@{/actions}" class="btn-browse">Browse Causes</a>
            </div>

            <div th:if="${!#lists.isEmpty(donations)}" class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Action</th>
                            <th>Amount</th>
                            <th>Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="donation : ${donations}">
                            <td>
                                <a th:href="@{/actions/{id}(id=${donation.charityAction.id})}" 
                                   class="action-link" 
                                   th:text="${donation.charityAction.title}">Action</a>
                            </td>
                            <td class="amount" th:text="${#numbers.formatDecimal(donation.amount, 1, 'WHITESPACE', 2, 'POINT') + ' DH'}">0.00 DH</td>
                            <td th:text="${#temporals.format(donation.donationDate, 'dd MMM yyyy HH:mm')}">Date</td>
                            <td>
                                <span class="status-badge status-completed" th:text="${donation.status}">COMPLETED</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
