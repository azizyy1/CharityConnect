<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - CharityConnect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/user-profile-edit.css}">
</head>
<body>

<header>
    <a th:href="@{/}" class="logo">CharityConnect</a>
    <nav>
        <a th:href="@{/}" class="nav-link"><i class="fas fa-home"></i> Home</a>
        <a th:href="@{/actions}" class="nav-link"><i class="fas fa-search"></i> Donations</a>
        <th:block th:if="${#authorization.expression('isAuthenticated()')}">
            <a th:href="@{/user/dashboard}" class="btn-dashboard">Dashboard</a>
            <a th:href="@{/user/profile}" title="Profile" style="color: var(--text-dark); font-size: 20px; margin-left: 20px;">
                <i class="fas fa-user-circle"></i>
            </a>
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button type="submit" class="btn-logout" style="background: none; border: none; cursor: pointer; color: var(--text-dark); font-weight: 500; font-size: 16px; margin-left: 30px; transition: 0.3s; font-family: inherit;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </form>
        </th:block>
    </nav>
</header>

<div class="main-content">
    <a th:href="@{/user/profile}" class="nav-back">
        <i class="fas fa-arrow-left"></i> Back to Profile
    </a>
    
    <div class="header">
        <h1>Edit My Profile</h1>
    </div>

    <div class="profile-container">
        <form th:action="@{/user/profile/edit}" th:object="${user}" method="post">
            <div class="form-grid">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" th:field="*{firstName}" class="form-control" placeholder="Your first name" required>
                    <p class="error-msg" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></p>
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" th:field="*{lastName}" class="form-control" placeholder="Your last name" required>
                    <p class="error-msg" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></p>
                </div>
                <div class="form-group full-width">
                    <label>Email Address (Cannot be changed)</label>
                    <input type="email" th:field="*{email}" class="form-control" disabled>
                </div>
                <div class="form-group full-width">
                    <label>Phone Number</label>
                    <input type="text" th:field="*{phone}" class="form-control" placeholder="e.g. +33 1 23 45 67 89">
                </div>
            </div>

            <div style="margin-top: 20px;">
                <button type="submit" class="btn-submit">
                    <i class="fas fa-save"></i> Save Changes
                </button>
                <a th:href="@{/user/profile}" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
