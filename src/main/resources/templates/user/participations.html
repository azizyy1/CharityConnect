<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Participations - CharityConnect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/user-participations.css}">
</head>
<body>

<header>
    <a th:href="@{/}" class="logo">CharityConnect</a>
    <nav>
        <a th:href="@{/}" class="nav-link"><i class="fas fa-home"></i> Home</a>
        <a th:href="@{/actions}" class="nav-link"><i class="fas fa-search"></i> Donations</a>
        <th:block th:if="${#authorization.expression('isAuthenticated()')}">
            <th:block th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
                <a th:href="@{/admin/dashboard}" class="btn-dashboard">Dashboard</a>
            </th:block>
            <th:block th:if="${#authorization.expression('hasRole(''ORGANIZATION'')')}">
                <a th:href="@{/organization/dashboard}" class="btn-dashboard">Dashboard</a>
                <a th:href="@{/organization/profile}" title="Profile" class="profile-link">
                    <i class="fas fa-building"></i>
                </a>
            </th:block>
            <th:block th:if="${#authorization.expression('hasRole(''USER'')')}">
                <a th:href="@{/user/dashboard}" class="btn-dashboard">Dashboard</a>
                <a th:href="@{/user/profile}" title="Profile" class="profile-link">
                    <i class="fas fa-user-circle"></i>
                </a>
            </th:block>
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button type="submit" class="btn-logout">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </form>
        </th:block>
    </nav>
</header>

    <div class="main-content">
        <a th:href="@{/user/dashboard}" class="nav-back">
            <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>

        <div class="header">
            <h1>My Volunteer Participations</h1>
        </div>

        <div class="card">
            <div th:if="${#lists.isEmpty(participations)}" class="empty-state">
                <i class="fas fa-calendar-times"></i>
                <p>You haven't participated in any actions yet.</p>
                <a th:href="@{/actions}" class="btn-browse">Browse Actions</a>
            </div>

            <div th:if="${!#lists.isEmpty(participations)}" class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Action</th>
                            <th>Date</th>
                            <th>Note</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="participation : ${participations}">
                            <td>
                                <a th:href="@{/actions/{id}(id=${participation.charityAction.id})}" 
                                   class="action-link" 
                                   th:text="${participation.charityAction.title}">Action</a>
                            </td>
                            <td th:text="${#temporals.format(participation.participationDate, 'dd MMM yyyy HH:mm')}">Date</td>
                            <td th:text="${participation.note != null && !participation.note.isEmpty() ? participation.note : '-'}">Note</td>
                            <td>
                                <span class="status-badge">Registered</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
