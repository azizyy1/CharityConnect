<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Mes participations</title>
</head>
<body>
<h1>Mes participations</h1>

<p th:if="${#lists.isEmpty(participations)}">Vous n'avez encore participé à aucune action.</p>

<table th:if="${!#lists.isEmpty(participations)}" border="1" cellpadding="6">
  <thead>
  <tr>
    <th>Action</th>
    <th>Date</th>
    <th>Note</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="participation : ${participations}">
    <td>
      <a th:href="@{/actions/{id}(id=${participation.charityAction.id})}"
         th:text="${participation.charityAction.title}">Action</a>
    </td>
    <td th:text="${#temporals.format(participation.participationDate, 'dd/MM/yyyy HH:mm')}">Date</td>
    <td th:text="${participation.note}">Note</td>
  </tr>
  </tbody>
</table>

<p><a th:href="@{/user/dashboard}">Retour au dashboard</a></p>
</body>
</html>
