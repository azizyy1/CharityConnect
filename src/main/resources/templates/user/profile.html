<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - CharityConnect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/user-profile.css}">
</head>
<body>

<header>
    <a th:href="@{/}" class="logo">CharityConnect</a>
    <nav>
        <a th:href="@{/}" class="nav-link"><i class="fas fa-home"></i> Home</a>
        <a th:href="@{/actions}" class="nav-link"><i class="fas fa-search"></i> Donations</a>
        <th:block th:if="${#authorization.expression('isAuthenticated()')}">
            <th:block th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
                <a th:href="@{/admin/dashboard}" class="btn-dashboard">Dashboard</a>
            </th:block>
            <th:block th:if="${#authorization.expression('hasRole(''ORGANIZATION'')')}">
                <a th:href="@{/organization/dashboard}" class="btn-dashboard">Dashboard</a>
                <a th:href="@{/organization/profile}" title="Profile" style="color: var(--text-dark); font-size: 20px; margin-left: 20px;">
                    <i class="fas fa-building"></i>
                </a>
            </th:block>
            <th:block th:if="${#authorization.expression('hasRole(''USER'')')}">
                <a th:href="@{/user/dashboard}" class="btn-dashboard">Dashboard</a>
                <a th:href="@{/user/profile}" title="Profile" style="color: var(--text-dark); font-size: 20px; margin-left: 20px;">
                    <i class="fas fa-user-circle"></i>
                </a>
            </th:block>
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button type="submit" class="btn-logout" style="background: none; border: none; cursor: pointer; color: var(--text-dark); font-weight: 500; font-size: 16px; margin-left: 30px; transition: 0.3s; font-family: inherit;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </form>
        </th:block>
    </nav>
</header>

    <div class="main-content">
        <a th:href="@{/user/dashboard}" class="nav-back">
            <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>
        
        <div class="header">
            <h1>My Profile</h1>
            <a th:href="@{/user/profile/edit}" class="btn-dashboard" style="text-decoration: none;">
                <i class="fas fa-edit"></i> Edit Profile
            </a>
        </div>

        <div th:if="${message}" class="alert-success" th:text="${message}" style="background-color: #d4edda; color: #155724; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 5px solid #28a745;"></div>

        <div class="profile-container">
            <div class="profile-header">
                <div class="profile-avatar" th:text="${#strings.substring(user.lastName, 0, 1)}">U</div>
                <div class="profile-info">
                    <h2 th:text="${user.firstName + ' ' + user.lastName}">User Name</h2>
                    <p th:text="${user.email}">user@example.com</p>
                </div>
            </div>

            <div class="info-grid">
                <div class="info-group">
                    <label>First Name</label>
                    <p th:text="${user.firstName}">First Name</p>
                </div>
                <div class="info-group">
                    <label>Last Name</label>
                    <p th:text="${user.lastName}">Last Name</p>
                </div>
                <div class="info-group">
                    <label>Email Address</label>
                    <p th:text="${user.email}">user@example.com</p>
                </div>
                <div class="info-group">
                    <label>Account Status</label>
                    <p th:text="${user.enabled ? 'Active' : 'Disabled'}">Active</p>
                </div>
            </div>

            <div class="dashboard-btn-container">
                <a th:href="@{/user/dashboard}" class="btn-to-dashboard">
                    <i class="fas fa-th-large"></i> Go to My Dashboard
                </a>
            </div>
        </div>
    </div>

</body>
</html>
