<!DOCTYPE html>
<html th:with="lang=${#locale.language}" th:lang="${lang}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{auth.register.title} + ' - CharityConnect'">Create Account</title>
    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body>

    <div class="auth-container">
        <a th:href="@{/}" class="close-btn">&times;</a>
        
        <h2 th:text="#{auth.register.title}">Create Account</h2>

        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <form th:action="@{/register}" th:object="${user}" method="post">
            <div class="form-row">
                <div class="form-group">
                    <input type="text" th:field="*{firstName}" class="form-control" th:placeholder="#{auth.register.firstname.placeholder}" required>
                    <span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="error-message"></span>
                </div>
                <div class="form-group">
                    <input type="text" th:field="*{lastName}" class="form-control" th:placeholder="#{auth.register.lastname.placeholder}" required>
                    <span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="error-message"></span>
                </div>
            </div>

            <div class="form-group">
                <input type="email" th:field="*{email}" class="form-control" th:placeholder="#{auth.register.email.placeholder}" required>
                <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error-message"></span>
            </div>

            <div class="form-group">
                <input type="password" th:field="*{password}" class="form-control" th:placeholder="#{auth.register.password.placeholder}" required minlength="8">
                <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error-message"></span>
            </div>

            <button type="submit" class="btn-submit">
                <span th:text="#{auth.register.submit}">Sign Up</span> 
                <span class="arrow-circle">&rarr;</span>
            </button>
        </form>

        <div class="auth-footer">
            <span th:text="#{auth.register.have_account}">Have an Account?</span> <a th:href="@{/login}" th:text="#{auth.register.signin}">Sign In</a>
        </div>
    </div>

</body>
</html>
