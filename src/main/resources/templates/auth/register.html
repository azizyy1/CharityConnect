<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body>

    <div class="auth-container">
        <a th:href="@{/}" class="close-btn">&times;</a>
        
        <h2>Create Account</h2>

        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <form th:action="@{/register}" th:object="${user}" method="post">
            <div class="form-row">
                <div class="form-group">
                    <input type="text" th:field="*{firstName}" class="form-control" placeholder="First Name" required>
                    <span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="error-message"></span>
                </div>
                <div class="form-group">
                    <input type="text" th:field="*{lastName}" class="form-control" placeholder="Last Name" required>
                    <span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="error-message"></span>
                </div>
            </div>

            <div class="form-group">
                <input type="email" th:field="*{email}" class="form-control" placeholder="Email Address" required>
                <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error-message"></span>
            </div>

            <div class="form-group">
                <input type="password" th:field="*{password}" class="form-control" placeholder="Password (min 8 characters)" required minlength="8">
                <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error-message"></span>
            </div>

            <button type="submit" class="btn-submit">
                Sign Up 
                <span class="arrow-circle">&rarr;</span>
            </button>
        </form>

        <div class="auth-footer">
            Have an Account? <a th:href="@{/login}">Sign In</a>
        </div>
    </div>

</body>
</html>
