<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Connexion</title>
</head>
<body>
<h2>Connexion</h2>

<p th:if="${param.error}">Email ou mot de passe invalide.</p>
<p th:if="${param.logout}">Déconnexion réussie.</p>
<p th:if="${param.registered}">Compte créé avec succès.</p>

<form th:action="@{/login}" method="post">
  <label>Email :</label><br>
  <input type="email" name="username" required><br><br>

  <label>Mot de passe :</label><br>
  <input type="password" name="password" required><br><br>

  <button type="submit">Se connecter</button>
</form>

<p>Pas encore de compte ? <a th:href="@{/register}">S'inscrire</a></p>
</body>
</html>
