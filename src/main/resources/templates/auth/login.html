<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to Faun</title>
    <style>
        :root {
            --primary-bg: #0a0a0a; /* Sombre comme en arrière-plan */
            --modal-bg: #ffffff;
            --input-border: #e0e0e0;
            --input-focus: #ff5733; /* Couleur orange/rouge du bouton */
            --btn-bg: #e5533d; /* Couleur du bouton de l'image */
            --text-main: #333333;
            --text-muted: #666666;
            --overlay-color: rgba(0, 0, 0, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(var(--overlay-color), var(--overlay-color)),
                        url('https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .auth-container {
            background-color: var(--modal-bg);
            width: 100%;
            max-width: 500px;
            padding: 60px 50px;
            border-radius: 4px; /* Coins légèrement arrondis comme l'image */
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: -40px;
            right: -40px;
            color: white;
            font-size: 24px;
            text-decoration: none;
            cursor: pointer;
        }

        h2 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 40px;
            color: #000;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-control {
            width: 100%;
            padding: 15px 20px;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
            color: var(--text-main);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--btn-bg);
        }

        .form-control::placeholder {
            color: #999;
        }

        .input-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            font-size: 14px;
            color: #000;
            font-weight: 500;
        }

        .checkbox-container input {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-submit {
            background-color: var(--btn-bg);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: background-color 0.3s;
            margin-bottom: 30px;
        }

        .btn-submit:hover {
            background-color: #d44834;
        }

        .btn-submit .arrow-circle {
            background-color: white;
            color: var(--btn-bg);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .auth-footer {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #000;
            font-weight: 500;
        }

        .auth-footer a {
            text-decoration: none;
            color: #000;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 14px;
            text-align: center;
        }
        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
        }
        .alert-info {
            background-color: #d1ecf1;
            color: #0c5460;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <a th:href="@{/}" class="close-btn">&times;</a>
        
        <h2>Sign in to Faun</h2>

        <div th:if="${param.error}" class="alert alert-error">Email ou mot de passe invalide.</div>
        <div th:if="${param.logout}" class="alert alert-info">Déconnexion réussie.</div>
        <div th:if="${message}" class="alert alert-info" th:text="${message}"></div>
        <div th:if="${param.organization_pending}" class="alert alert-info">Votre inscription organisation est en attente de validation admin.</div>
        <div th:if="${param.pending_admin_validation}" class="alert alert-info">Compte organisation créé : en attente de validation admin.</div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <input type="email" name="username" class="form-control" placeholder="Username or Email Address" required>
                <span class="input-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3y-3.5L15.5 7.5z"></path></svg>
                </span>
            </div>

            <div class="form-group">
                <input type="password" name="password" class="form-control" placeholder="Password" required>
            </div>

            <label class="checkbox-container">
                <input type="checkbox" name="remember-me">
                Remember Me
            </label>

            <button type="submit" class="btn-submit">
                Sign In 
                <span class="arrow-circle">&rarr;</span>
            </button>
        </form>

        <div class="auth-footer">
            <a href="#">Lost Your Password?</a>
            <a th:href="@{/register}">Create Account</a>
        </div>
    </div>

</body>
</html>
