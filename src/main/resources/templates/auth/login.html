<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Login</title></head>
<body>
<h2>Connexion</h2>

<div th:if="${param.error}">Email ou mot de passe invalide.</div>
<div th:if="${param.logout}">Déconnecté avec succès.</div>
<div th:if="${param.registered}">Compte créé avec succès.</div>

<form th:action="@{/login}" method="post">
  <label>Email:</label><br>
  <input type="email" name="username" required><br><br>

  <label>Mot de passe:</label><br>
  <input type="password" name="password" required><br><br>

  <button type="submit">Se connecter</button>
</form>

<p>Pas de compte ? <a th:href="@{/register}">S'inscrire</a></p>
</body>
</html>
