<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Organization Account</title>
    <style>
        :root {
            --primary-bg: #0a0a0a;
            --modal-bg: #ffffff;
            --input-border: #e0e0e0;
            --btn-bg: #e5533d;
            --text-main: #333333;
            --overlay-color: rgba(0, 0, 0, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(var(--overlay-color), var(--overlay-color)),
                        url('https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .auth-container {
            background-color: var(--modal-bg);
            width: 100%;
            max-width: 650px;
            padding: 40px 50px;
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #333;
            font-size: 24px;
            text-decoration: none;
            cursor: pointer;
        }

        h2 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 30px;
            color: #000;
            font-weight: 500;
        }

        h3 {
            font-size: 18px;
            margin-bottom: 20px;
            color: var(--btn-bg);
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }

        .form-group {
            flex: 1;
            margin-bottom: 15px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
            color: var(--text-main);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--btn-bg);
        }

        textarea.form-control {
            resize: vertical;
        }

        .btn-submit {
            background-color: var(--btn-bg);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: background-color 0.3s;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .btn-submit:hover {
            background-color: #d44834;
        }

        .btn-submit .arrow-circle {
            background-color: white;
            color: var(--btn-bg);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .auth-footer {
            font-size: 14px;
            color: #000;
            font-weight: 500;
            text-align: center;
        }

        .auth-footer a {
            text-decoration: none;
            color: #000;
        }

        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 14px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <a th:href="@{/}" class="close-btn">&times;</a>
        
        <h2>Register Organization</h2>

        <div th:if="${param.error}" class="alert alert-error">Email déjà utilisé.</div>

        <form th:action="@{/register/organization}" method="post">
            <h3>Account Information</h3>
            <div class="form-row">
                <div class="form-group">
                    <input type="text" name="firstName" class="form-control" placeholder="Responsible First Name" required>
                </div>
                <div class="form-group">
                    <input type="text" name="lastName" class="form-control" placeholder="Responsible Last Name" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <input type="email" name="email" class="form-control" placeholder="Email Address" required>
                </div>
                <div class="form-group">
                    <input type="text" name="phone" class="form-control" placeholder="Phone Number">
                </div>
            </div>

            <div class="form-group">
                <input type="password" name="password" class="form-control" placeholder="Password" required>
            </div>

            <h3>Organization Details</h3>
            <div class="form-group">
                <input type="text" name="organizationName" class="form-control" placeholder="Organization Name" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <input type="text" name="legalAddress" class="form-control" placeholder="Legal Address">
                </div>
                <div class="form-group">
                    <input type="text" name="taxId" class="form-control" placeholder="Tax ID">
                </div>
            </div>

            <div class="form-group">
                <textarea name="description" class="form-control" placeholder="Organization Description" rows="3"></textarea>
            </div>

            <button type="submit" class="btn-submit">
                Create Account 
                <span class="arrow-circle">&rarr;</span>
            </button>
        </form>

        <div class="auth-footer">
            Already registered? <a th:href="@{/login}">Sign In</a>
        </div>
    </div>

</body>
</html>
