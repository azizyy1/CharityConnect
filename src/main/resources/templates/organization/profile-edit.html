<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit Organization Profile', ~{::link})}">
    <link rel="stylesheet" th:href="@{/css/organization-profile-edit.css}">
</head>
<body>

<header th:replace="~{fragments/layout :: header(false)}"></header>

<div class="main-content">
    <a th:href="@{/organization/profile}" class="nav-back">
        <i class="fas fa-arrow-left"></i> Back to Profile
    </a>
    
    <div class="header">
        <h1>Edit Organization Profile</h1>
    </div>

    <div class="profile-container">
        <form th:action="@{/organization/profile/edit}" th:object="${organization}" method="post">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label>Organization Name</label>
                    <input type="text" th:field="*{name}" class="form-control" placeholder="Enter organization name" required>
                    <p class="error-msg" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                </div>
                <div class="form-group full-width">
                    <label>About Us / Mission</label>
                    <textarea th:field="*{description}" class="form-control" placeholder="Describe your organization's mission..."></textarea>
                    <p class="error-msg" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>
                </div>
                <div class="form-group">
                    <label>Tax ID / Registration Number</label>
                    <input type="text" th:field="*{taxId}" class="form-control" placeholder="e.g. TAX-123456" required>
                    <p class="error-msg" th:if="${#fields.hasErrors('taxId')}" th:errors="*{taxId}"></p>
                </div>
                <div class="form-group">
                    <label>Legal Address</label>
                    <input type="text" th:field="*{legalAddress}" class="form-control" placeholder="Enter legal address" required>
                    <p class="error-msg" th:if="${#fields.hasErrors('legalAddress')}" th:errors="*{legalAddress}"></p>
                </div>
                <div class="form-group">
                    <label>Logo URL</label>
                    <input type="text" th:field="*{logo}" class="form-control" placeholder="https://example.com/logo.png">
                </div>
                <div class="form-group">
                    <label>Email (Account email cannot be changed)</label>
                    <input type="email" th:value="${organization.user.email}" class="form-control" disabled title="Account email cannot be changed">
                </div>
            </div>

            <div style="margin-top: 20px;">
                <button type="submit" class="btn-submit">
                    <i class="fas fa-save"></i> Save Changes
                </button>
                <a th:href="@{/organization/profile}" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
