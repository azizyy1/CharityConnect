<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Organization Profile', ~{::link})}">
    <link rel="stylesheet" th:href="@{/css/organization-profile.css}">
</head>
<body>

<header th:replace="~{fragments/layout :: header(false)}"></header>

    <div class="main-content">
        <a th:href="@{/organization/dashboard}" class="nav-back">
            <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>
        
            <div class="header">
                <h1>Organization Profile</h1>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <a th:href="@{/organization/profile/edit}" class="btn-dashboard" style="text-decoration: none;">
                        <i class="fas fa-edit"></i> Edit Profile
                    </a>
                    <form th:action="@{/logout}" method="post" style="display: inline;">
                        <button type="submit" class="btn-logout-profile">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </button>
                    </form>
                </div>
            </div>

        <div th:if="${message}" class="alert-success" th:text="${message}" style="background-color: #d4edda; color: #155724; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 5px solid #28a745;"></div>

        <div class="profile-container">
            <div class="profile-header">
                <div class="profile-logo">
                    <img th:if="${organization.logo != null && !organization.logo.isEmpty()}" th:src="${organization.logo}" alt="Logo">
                    <i th:unless="${organization.logo != null && !organization.logo.isEmpty()}" class="fas fa-university"></i>
                </div>
                <div class="profile-info">
                    <h2 th:text="${organization.name}">Organization Name</h2>
                    <p th:text="${organization.user.email}">contact@organization.com</p>
                </div>
            </div>

            <div class="info-grid">
                <div class="info-group">
                    <label>Legal Name</label>
                    <p th:text="${organization.name}">Organization Name</p>
                </div>
                <div class="info-group">
                    <label>Tax ID / Registration Number</label>
                    <p th:text="${organization.taxId}">TAX-123456</p>
                </div>
                <div class="info-group">
                    <label>Verification Status</label>
                    <div>
                        <span th:if="${organization.approved}" class="status-badge status-approved">
                            <i class="fas fa-check-circle"></i> Approved
                        </span>
                        <span th:unless="${organization.approved}" class="status-badge status-pending">
                            <i class="fas fa-clock"></i> Pending Approval
                        </span>
                    </div>
                </div>
                <div class="info-group">
                    <label>Contact Email</label>
                    <p th:text="${organization.user.email}">contact@organization.com</p>
                </div>
                <div class="info-group full-width">
                    <label>Legal Address</label>
                    <p th:text="${organization.legalAddress}">123 Charity Lane, Good City</p>
                </div>
                <div class="info-group full-width">
                    <label>About Us</label>
                    <p th:text="${organization.description}">Our organization mission description...</p>
                </div>
            </div>

            <div class="dashboard-btn-container">
                <a th:href="@{/organization/dashboard}" class="btn-to-dashboard">
                    <i class="fas fa-th-large"></i> Go to My Dashboard
                </a>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
