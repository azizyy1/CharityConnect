<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{org.sidebar.actions} + ' - CharityConnect'">My Actions - CharityConnect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/organization-actions.css}">
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            CharityConnect
        </div>
        <div class="sidebar-menu">
            <a th:href="@{/organization/dashboard}">
                <i class="fas fa-chart-line"></i>
                <span th:text="#{org.sidebar.dashboard}">Dashboard</span>
            </a>
            <a th:href="@{/organization/profile}">
                <i class="fas fa-building"></i> <span th:text="#{org.sidebar.profile}">Profile</span>
            </a>
            <a th:href="@{/organization/actions}" class="active">
                <i class="fas fa-hand-holding-heart"></i>
                <span th:text="#{org.sidebar.actions}">My Actions</span>
            </a>
            <a th:href="@{/actions}">
                <i class="fas fa-globe"></i>
                <span th:text="#{org.sidebar.public}">Public List</span>
            </a>
        </div>
        <div class="sidebar-footer">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="logout-btn" style="background: none; border: none; width: 100%; text-align: left; padding: 0; cursor: pointer; color: inherit; font-family: inherit; font-size: inherit;">
                    <i class="fas fa-sign-out-alt"></i>
                    <span th:text="#{org.sidebar.signout}">Sign Out</span>
                </button>
            </form>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1 th:text="${#messages.msg('org.actions.title', organization.name)}">My Actions</h1>
            <a th:href="@{/organization/actions/new}" class="btn-create">
                <i class="fas fa-plus"></i>
                <span th:text="#{org.actions.new}">New Action</span>
            </a>
        </div>

        <div th:if="${message}" class="alert-success" th:text="${message}"></div>

        <div class="data-card">
            <table>
                <thead>
                    <tr>
                        <th th:text="#{org.actions.table.title}">Title</th>
                        <th th:text="#{org.actions.table.category}">Category</th>
                        <th th:text="#{org.actions.table.target}">Target</th>
                        <th th:text="#{org.actions.table.collected}">Collected</th>
                        <th th:text="#{org.actions.table.status}">Status</th>
                        <th th:text="#{org.actions.table.actions}">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="action : ${actions}">
                        <td th:text="${action.title}" style="font-weight: 500;"></td>
                        <td th:text="${action.category}"></td>
                        <td th:text="${#numbers.formatDecimal(action.targetAmount, 1, 'COMMA', 2, 'POINT') + ' DH'}"></td>
                        <td th:text="${#numbers.formatDecimal(action.collectedAmount, 1, 'COMMA', 2, 'POINT') + ' DH'}"></td>
                        <td>
                            <span th:class="'badge ' + (${action.status.name() == 'ACTIVE'} ? 'badge-active' : 'badge-archived')"
                                  th:text="${action.status}">
                            </span>
                        </td>
                        <td class="action-btns">
                            <a th:href="@{/actions/{id}(id=${action.id})}" class="btn-icon btn-view" title="View Publicly" target="_blank">
                                <i class="fas fa-eye"></i>
                            </a>
                            <a th:href="@{/organization/actions/{id}/edit(id=${action.id})}" 
                               th:if="${action.status.name() == 'ACTIVE'}"
                               class="btn-icon btn-edit" title="Edit Action">
                                <i class="fas fa-edit"></i>
                            </a>
                            <form th:if="${action.status.name() == 'ACTIVE'}"
                                  th:action="@{/organization/actions/{id}/archive(id=${action.id})}"
                                  method="post" style="display:inline">
                                <button type="submit" class="btn-icon btn-archive" title="Archive Action" 
                                        th:attr="onclick='return confirm(\'' + #{org.actions.confirm.archive} + '\')'">
                                    <i class="fas fa-archive"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
