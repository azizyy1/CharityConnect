<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Actions - CharityConnect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #e5533d;
            --sidebar-bg: #1a1a1a;
            --main-bg: #f4f7f6;
            --text-light: #ffffff;
            --text-dark: #333333;
            --card-bg: #ffffff;
            --border-color: #e0e0e0;
            --success-color: #28a745;
            --info-color: #17a2b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            background-color: var(--main-bg);
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 1000;
        }

        .sidebar-header {
            padding: 30px 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-menu {
            flex: 1;
            padding: 20px 0;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            padding: 15px 25px;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            transition: 0.3s;
        }

        .sidebar-menu a i {
            margin-right: 15px;
            width: 20px;
            text-align: center;
        }

        .sidebar-menu a:hover, .sidebar-menu a.active {
            background-color: rgba(255,255,255,0.1);
            color: var(--text-light);
            border-left: 4px solid var(--primary-color);
        }

        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .logout-btn {
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Main Content */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 28px;
            color: var(--text-dark);
        }

        .btn-create {
            background-color: var(--primary-color);
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }

        .btn-create:hover {
            background-color: #d44834;
        }

        /* Table Style */
        .data-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            padding: 20px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 15px;
            border-bottom: 2px solid var(--main-bg);
            color: #777;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 13px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid var(--main-bg);
            color: var(--text-dark);
            vertical-align: middle;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge-active { background-color: #e8f5e9; color: #2e7d32; }
        .badge-archived { background-color: #f5f5f5; color: #757575; }

        .action-btns {
            display: flex;
            gap: 10px;
        }

        .btn-icon {
            width: 35px;
            height: 35px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: 0.3s;
            border: none;
            cursor: pointer;
        }

        .btn-view { background-color: #e3f2fd; color: #1976d2; }
        .btn-edit { background-color: #fff3e0; color: #ef6c00; }
        .btn-archive { background-color: #ffebee; color: #c62828; }

        .btn-icon:hover { opacity: 0.8; transform: scale(1.05); }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 5px solid #28a745;
        }

        @media (max-width: 768px) {
            .sidebar { width: 70px; }
            .sidebar-header, .sidebar-menu span, .sidebar-footer span { display: none; }
            .main-content { margin-left: 70px; padding: 20px; }
            .sidebar-menu a { padding: 15px; justify-content: center; }
            .sidebar-menu a i { margin-right: 0; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            CharityConnect
        </div>
        <div class="sidebar-menu">
            <a th:href="@{/organization/dashboard}">
                <i class="fas fa-chart-line"></i>
                <span>Dashboard</span>
            </a>
            <a th:href="@{/organization/profile}">
                <i class="fas fa-building"></i> <span>Profile</span>
            </a>
            <a th:href="@{/organization/actions}" class="active">
                <i class="fas fa-hand-holding-heart"></i>
                <span>My Actions</span>
            </a>
            <a th:href="@{/actions}">
                <i class="fas fa-globe"></i>
                <span>Public List</span>
            </a>
        </div>
        <div class="sidebar-footer">
            <a th:href="@{/logout}" class="logout-btn">
                <i class="fas fa-sign-out-alt"></i>
                <span>Sign Out</span>
            </a>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1 th:text="'My Actions (' + ${organization.name} + ')'">My Actions</h1>
            <a th:href="@{/organization/actions/new}" class="btn-create">
                <i class="fas fa-plus"></i>
                New Action
            </a>
        </div>

        <div th:if="${message}" class="alert-success" th:text="${message}"></div>

        <div class="data-card">
            <table>
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Target</th>
                        <th>Collected</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="action : ${actions}">
                        <td th:text="${action.title}" style="font-weight: 500;"></td>
                        <td th:text="${action.category}"></td>
                        <td th:text="'$' + ${#numbers.formatDecimal(action.targetAmount, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td th:text="'$' + ${#numbers.formatDecimal(action.collectedAmount, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td>
                            <span th:class="'badge ' + (${action.status.name() == 'ACTIVE'} ? 'badge-active' : 'badge-archived')"
                                  th:text="${action.status}">
                            </span>
                        </td>
                        <td class="action-btns">
                            <a th:href="@{/actions/{id}(id=${action.id})}" class="btn-icon btn-view" title="View Publicly" target="_blank">
                                <i class="fas fa-eye"></i>
                            </a>
                            <a th:href="@{/organization/actions/{id}/edit(id=${action.id})}" 
                               th:if="${action.status.name() == 'ACTIVE'}"
                               class="btn-icon btn-edit" title="Edit Action">
                                <i class="fas fa-edit"></i>
                            </a>
                            <form th:if="${action.status.name() == 'ACTIVE'}"
                                  th:action="@{/organization/actions/{id}/archive(id=${action.id})}"
                                  method="post" style="display:inline">
                                <button type="submit" class="btn-icon btn-archive" title="Archive Action" 
                                        onclick="return confirm('Are you sure you want to archive this action? This will stop accepting donations and remove it from the public list.')">
                                    <i class="fas fa-archive"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
