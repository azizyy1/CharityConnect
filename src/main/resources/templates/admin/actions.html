<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charity Actions Audit - CharityConnect Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin-actions.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <span>CharityConnect</span>
        </div>
        <div class="sidebar-menu">
            <a th:href="@{/admin/dashboard}">
                <i class="fas fa-chart-line"></i> &nbsp; <span>Dashboard</span>
            </a>
            <a th:href="@{/admin/organizations}">
                <i class="fas fa-building"></i> &nbsp; <span>Organizations</span>
            </a>
            <a th:href="@{/admin/actions}" class="active">
                <i class="fas fa-hand-holding-heart"></i> &nbsp; <span>Actions</span>
            </a>
            <a th:href="@{/admin/users}">
                <i class="fas fa-users"></i> &nbsp; <span>Users</span>
            </a>
            <a th:href="@{/admin/donations}">
                <i class="fas fa-donate"></i> &nbsp; <span>Donations</span>
            </a>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Charity Actions Audit</h1>
            <a th:href="@{/admin/dashboard}" style="text-decoration: none; color: var(--primary-color);"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </div>

        <div th:if="${message}" class="alert-success" th:text="${message}"></div>

        <div class="filter-card">
            <form th:action="@{/admin/actions}" method="get" class="filter-form">
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" name="status" class="form-control">
                        <option value="">All Statuses</option>
                        <option th:each="s : ${statuses}"
                                th:value="${s}"
                                th:text="${s}"
                                th:selected="${selectedStatus == s}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Start Date From</label>
                    <input id="date" type="date" name="date" th:value="${selectedDate}" class="form-control">
                </div>
                <button type="submit" class="btn-filter">Apply Filters</button>
                <a th:href="@{/admin/actions}" class="btn-reset">Clear</a>
            </form>
        </div>

        <div class="content-card">
            <table>
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Dates</th>
                        <th>Status</th>
                        <th>Organization</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="action : ${actions}">
                        <td>
                            <div th:text="${action.title}" style="font-weight: bold; color: var(--text-dark);"></div>
                        </td>
                        <td th:text="${action.category}"></td>
                        <td>
                            <div style="font-size: 13px;">
                                <span th:text="${action.startDate}"></span> <br>
                                <span th:text="${action.endDate}" style="color: #888;"></span>
                            </div>
                        </td>
                        <td>
                            <span th:text="${action.status}" 
                                  th:classappend="${action.status.name() == 'ARCHIVED' ? 'badge badge-archived' : 'badge badge-active'}">
                            </span>
                        </td>
                        <td th:text="${action.organization.name}"></td>
                        <td>
                            <form th:if="${action.status.name() != 'ARCHIVED'}"
                                  th:action="@{/admin/actions/{id}/archive(id=${action.id})}"
                                  method="post">
                                <button type="submit" class="btn-archive">Archive</button>
                            </form>
                            <span th:if="${action.status.name() == 'ARCHIVED'}" style="color: #888; font-size: 12px;">Archived</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(actions)}">
                        <td colspan="6" style="text-align: center; padding: 30px; color: #888;">No charity actions found matching the filters.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
