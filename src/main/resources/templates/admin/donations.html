<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donation Audit - CharityConnect Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin-donations.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <span>CharityConnect</span>
        </div>
        <div class="sidebar-menu">
            <a th:href="@{/admin/dashboard}">
                <i class="fas fa-chart-line"></i> &nbsp; <span>Dashboard</span>
            </a>
            <a th:href="@{/admin/organizations}">
                <i class="fas fa-building"></i> &nbsp; <span>Organizations</span>
            </a>
            <a th:href="@{/admin/actions}">
                <i class="fas fa-hand-holding-heart"></i> &nbsp; <span>Actions</span>
            </a>
            <a th:href="@{/admin/users}">
                <i class="fas fa-users"></i> &nbsp; <span>Users</span>
            </a>
            <a th:href="@{/admin/donations}" class="active">
                <i class="fas fa-donate"></i> &nbsp; <span>Donations</span>
            </a>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Donation Transaction Audit</h1>
            <a th:href="@{/admin/dashboard}" style="text-decoration: none; color: var(--primary-color);"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </div>

        <div class="filter-card">
            <form th:action="@{/admin/donations}" method="get" class="filter-form">
                <div class="form-group">
                    <label for="userEmail">User Email</label>
                    <input id="userEmail" type="text" name="userEmail" th:value="${selectedUserEmail}" class="form-control" placeholder="Search by email...">
                </div>
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" name="status" class="form-control">
                        <option value="">All Statuses</option>
                        <option th:each="s : ${statuses}"
                                th:value="${s}"
                                th:text="${s}"
                                th:selected="${selectedStatus == s}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date From</label>
                    <input id="date" type="date" name="date" th:value="${selectedDate}" class="form-control">
                </div>
                <button type="submit" class="btn-filter">Apply Filters</button>
                <a th:href="@{/admin/donations}" class="btn-reset">Clear</a>
            </form>
        </div>

        <div class="content-card">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>User</th>
                        <th>Charity Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="donation : ${donations}">
                        <td th:text="${donation.donationDate}" style="font-size: 14px;"></td>
                        <td class="amount" th:text="${donation.amount + ' DH'}"></td>
                        <td>
                            <span class="badge-status" th:text="${donation.status}"></span>
                        </td>
                        <td th:text="${donation.user.email}"></td>
                        <td th:text="${donation.charityAction.title}" style="font-weight: 500;"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(donations)}">
                        <td colspan="5" style="text-align: center; padding: 30px; color: #888;">No donations recorded.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
