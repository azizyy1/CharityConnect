<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - CharityConnect Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin-users.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <span>CharityConnect</span>
        </div>
        <div class="sidebar-menu">
            <a th:href="@{/admin/dashboard}">
                <i class="fas fa-chart-line"></i> &nbsp; <span>Dashboard</span>
            </a>
            <a th:href="@{/admin/organizations}">
                <i class="fas fa-building"></i> &nbsp; <span>Organizations</span>
            </a>
            <a th:href="@{/admin/actions}">
                <i class="fas fa-hand-holding-heart"></i> &nbsp; <span>Actions</span>
            </a>
            <a th:href="@{/admin/users}" class="active">
                <i class="fas fa-users"></i> &nbsp; <span>Users</span>
            </a>
            <a th:href="@{/admin/donations}">
                <i class="fas fa-donate"></i> &nbsp; <span>Donations</span>
            </a>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>User Management</h1>
            <a th:href="@{/admin/dashboard}" style="text-decoration: none; color: var(--primary-color);"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </div>

        <div th:if="${message}" class="alert-info" th:text="${message}"></div>

        <div class="content-card">
            <table>
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Created At</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td>
                            <div th:text="${user.firstName + ' ' + user.lastName}" style="font-weight: bold; color: var(--text-dark);"></div>
                        </td>
                        <td th:text="${user.email}"></td>
                        <td>
                            <span class="badge badge-role" th:text="${user.role}"></span>
                        </td>
                        <td>
                            <span th:if="${user.enabled}" class="badge badge-enabled">Active</span>
                            <span th:if="${!user.enabled}" class="badge badge-disabled">Disabled</span>
                        </td>
                        <td th:text="${#temporals.format(user.createdAt, 'dd/MM/yyyy HH:mm')}" style="font-size: 13px; color: #666;"></td>
                        <td>
                            <div class="action-btns" style="display: flex; gap: 10px;">
                                <form th:action="@{/admin/users/{id}/toggle-enabled(id=${user.id})}" method="post">
                                    <button type="submit" class="btn-toggle" th:text="${user.enabled ? 'Deactivate' : 'Activate'}"
                                            th:style="${user.enabled ? 'color: #c62828;' : 'color: #2e7d32;'}"></button>
                                </form>
                                <th:block th:if="${user.role.name() == 'ROLE_USER'}">
                                    <a th:href="@{/admin/donations(userEmail=${user.email})}" class="btn-toggle" title="View Donations" style="text-decoration: none;">
                                        <i class="fas fa-hand-holding-usd"></i>
                                    </a>
                                </th:block>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
