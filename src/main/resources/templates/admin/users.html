<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - CharityConnect Admin</title>
    <style>
        :root {
            --primary-color: #e5533d;
            --sidebar-bg: #1a1a1a;
            --main-bg: #f4f7f6;
            --text-light: #ffffff;
            --text-dark: #333333;
            --card-bg: #ffffff;
            --border-color: #e0e0e0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            background-color: var(--main-bg);
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
        }

        .sidebar-header {
            padding: 30px 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-menu {
            flex: 1;
            padding: 20px 0;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            padding: 15px 25px;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            transition: 0.3s;
        }

        .sidebar-menu a:hover, .sidebar-menu a.active {
            background-color: rgba(255,255,255,0.1);
            color: var(--text-light);
            border-left: 4px solid var(--primary-color);
        }

        /* Main Content */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        /* Table Styling */
        .content-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            padding: 25px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 15px;
            border-bottom: 2px solid var(--border-color);
            color: #888;
            font-size: 14px;
            text-transform: uppercase;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-dark);
            vertical-align: middle;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        .badge-enabled { background-color: #e8f5e9; color: #2e7d32; }
        .badge-disabled { background-color: #ffebee; color: #c62828; }
        .badge-role { background-color: #f3e5f5; color: #7b1fa2; }

        .btn-toggle {
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: white;
            cursor: pointer;
            font-size: 12px;
            transition: 0.3s;
        }

        .btn-toggle:hover {
            background-color: #f5f5f5;
        }

        .alert-info {
            background-color: #e3f2fd;
            color: #0d47a1;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        @media (max-width: 992px) {
            .sidebar { width: 80px; }
            .sidebar-header span, .sidebar-menu a span { display: none; }
            .main-content { margin-left: 80px; }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <span>CharityConnect</span>
        </div>
        <div class="sidebar-menu">
            <a th:href="@{/admin/dashboard}">
                <i class="fas fa-chart-line"></i> &nbsp; <span>Dashboard</span>
            </a>
            <a th:href="@{/admin/organizations}">
                <i class="fas fa-building"></i> &nbsp; <span>Organizations</span>
            </a>
            <a th:href="@{/admin/actions}">
                <i class="fas fa-hand-holding-heart"></i> &nbsp; <span>Actions</span>
            </a>
            <a th:href="@{/admin/users}" class="active">
                <i class="fas fa-users"></i> &nbsp; <span>Users</span>
            </a>
            <a th:href="@{/admin/donations}">
                <i class="fas fa-donate"></i> &nbsp; <span>Donations</span>
            </a>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>User Management</h1>
            <a th:href="@{/admin/dashboard}" style="text-decoration: none; color: var(--primary-color);"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </div>

        <div th:if="${message}" class="alert-info" th:text="${message}"></div>

        <div class="content-card">
            <table>
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Created At</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td>
                            <div th:text="${user.firstName + ' ' + user.lastName}" style="font-weight: bold; color: var(--text-dark);"></div>
                        </td>
                        <td th:text="${user.email}"></td>
                        <td>
                            <span class="badge badge-role" th:text="${user.role}"></span>
                        </td>
                        <td>
                            <span th:if="${user.enabled}" class="badge badge-enabled">Active</span>
                            <span th:if="${!user.enabled}" class="badge badge-disabled">Disabled</span>
                        </td>
                        <td th:text="${#temporals.format(user.createdAt, 'dd/MM/yyyy HH:mm')}" style="font-size: 13px; color: #666;"></td>
                        <td>
                            <div class="action-btns" style="display: flex; gap: 10px;">
                                <form th:action="@{/admin/users/{id}/toggle-enabled(id=${user.id})}" method="post">
                                    <button type="submit" class="btn-toggle" th:text="${user.enabled ? 'Deactivate' : 'Activate'}"
                                            th:style="${user.enabled ? 'color: #c62828;' : 'color: #2e7d32;'}"></button>
                                </form>
                                <th:block th:if="${user.role.name() == 'ROLE_USER'}">
                                    <a th:href="@{/admin/donations(userEmail=${user.email})}" class="btn-toggle" title="View Donations" style="text-decoration: none;">
                                        <i class="fas fa-hand-holding-usd"></i>
                                    </a>
                                </th:block>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
