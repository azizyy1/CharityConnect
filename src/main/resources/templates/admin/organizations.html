<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizations - CharityConnect Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin-organizations.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <span>CharityConnect</span>
        </div>
        <div class="sidebar-menu">
            <a th:href="@{/admin/dashboard}">
                <i class="fas fa-chart-line"></i> &nbsp; <span>Dashboard</span>
            </a>
            <a th:href="@{/admin/organizations}" class="active">
                <i class="fas fa-building"></i> &nbsp; <span>Organizations</span>
            </a>
            <a th:href="@{/admin/actions}">
                <i class="fas fa-hand-holding-heart"></i> &nbsp; <span>Actions</span>
            </a>
            <a th:href="@{/admin/users}">
                <i class="fas fa-users"></i> &nbsp; <span>Users</span>
            </a>
            <a th:href="@{/admin/donations}">
                <i class="fas fa-donate"></i> &nbsp; <span>Donations</span>
            </a>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Organization Validation</h1>
            <a th:href="@{/admin/dashboard}" style="text-decoration: none; color: var(--primary-color);"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </div>

        <div th:if="${message}" class="alert-info" th:text="${message}"></div>

        <div class="content-card">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email Account</th>
                        <th>Tax ID</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="org : ${organizations}">
                        <td th:text="${org.name}" style="font-weight: bold;"></td>
                        <td th:text="${org.user.email}"></td>
                        <td th:text="${org.taxId}"></td>
                        <td>
                            <span th:if="${org.approved}" class="badge badge-success">Approved</span>
                            <span th:if="${!org.approved}" class="badge badge-warning">Pending</span>
                        </td>
                        <td>
                            <form th:if="${!org.approved}" th:action="@{/admin/organizations/{id}/approve(id=${org.id})}" method="post">
                                <button type="submit" class="btn-approve">Approve</button>
                            </form>
                            <span th:if="${org.approved}" style="color: var(--success-color);"><i class="fas fa-check-circle"></i> Validated</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(organizations)}">
                        <td colspan="5" style="text-align: center; padding: 30px; color: #888;">No organizations found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
