<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizations - CharityConnect Admin</title>
    <style>
        :root {
            --primary-color: #e5533d;
            --sidebar-bg: #1a1a1a;
            --main-bg: #f4f7f6;
            --text-light: #ffffff;
            --text-dark: #333333;
            --card-bg: #ffffff;
            --border-color: #e0e0e0;
            --success-color: #28a745;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            background-color: var(--main-bg);
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
        }

        .sidebar-header {
            padding: 30px 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-menu {
            flex: 1;
            padding: 20px 0;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            padding: 15px 25px;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            transition: 0.3s;
        }

        .sidebar-menu a:hover, .sidebar-menu a.active {
            background-color: rgba(255,255,255,0.1);
            color: var(--text-light);
            border-left: 4px solid var(--primary-color);
        }

        /* Main Content */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        /* Table Styling */
        .content-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            padding: 25px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            text-align: left;
            padding: 15px;
            border-bottom: 2px solid var(--border-color);
            color: #888;
            font-size: 14px;
            text-transform: uppercase;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-dark);
            vertical-align: middle;
        }

        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-success { background-color: #d4edda; color: #155724; }
        .badge-warning { background-color: #fff3cd; color: #856404; }

        .btn-approve {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-approve:hover { background-color: #d44834; }

        .alert-info {
            background-color: #d1ecf1;
            color: #0c5460;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        @media (max-width: 992px) {
            .sidebar { width: 80px; }
            .sidebar-header span, .sidebar-menu a span { display: none; }
            .main-content { margin-left: 80px; }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <span>CharityConnect</span>
        </div>
        <div class="sidebar-menu">
            <a th:href="@{/admin/dashboard}">
                <i class="fas fa-chart-line"></i> &nbsp; <span>Dashboard</span>
            </a>
            <a th:href="@{/admin/organizations}" class="active">
                <i class="fas fa-building"></i> &nbsp; <span>Organizations</span>
            </a>
            <a th:href="@{/admin/actions}">
                <i class="fas fa-hand-holding-heart"></i> &nbsp; <span>Actions</span>
            </a>
            <a th:href="@{/admin/users}">
                <i class="fas fa-users"></i> &nbsp; <span>Users</span>
            </a>
            <a th:href="@{/admin/donations}">
                <i class="fas fa-donate"></i> &nbsp; <span>Donations</span>
            </a>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Organization Validation</h1>
            <a th:href="@{/admin/dashboard}" style="text-decoration: none; color: var(--primary-color);"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </div>

        <div th:if="${message}" class="alert-info" th:text="${message}"></div>

        <div class="content-card">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email Account</th>
                        <th>Tax ID</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="org : ${organizations}">
                        <td th:text="${org.name}" style="font-weight: bold;"></td>
                        <td th:text="${org.user.email}"></td>
                        <td th:text="${org.taxId}"></td>
                        <td>
                            <span th:if="${org.approved}" class="badge badge-success">Approved</span>
                            <span th:if="${!org.approved}" class="badge badge-warning">Pending</span>
                        </td>
                        <td>
                            <form th:if="${!org.approved}" th:action="@{/admin/organizations/{id}/approve(id=${org.id})}" method="post">
                                <button type="submit" class="btn-approve">Approve</button>
                            </form>
                            <span th:if="${org.approved}" style="color: var(--success-color);"><i class="fas fa-check-circle"></i> Validated</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(organizations)}">
                        <td colspan="5" style="text-align: center; padding: 30px; color: #888;">No organizations found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
