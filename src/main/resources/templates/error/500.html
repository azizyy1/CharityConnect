<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error | CharityConnect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body>
    <div class="error-container">
        <div class="error-icon">
            <i class="fas fa-exclamation-triangle"></i>
        </div>
        <h1>500</h1>
        <h2>Oops! Something went wrong</h2>
        <p th:if="${errorMessage}" th:text="${errorMessage}"></p>
        <p th:unless="${errorMessage}">We're experiencing some technical difficulties. Please try again later or contact support if the problem persists.</p>
        
        <a th:href="@{/}" class="btn-home">
            <i class="fas fa-home"></i> Back to Home
        </a>

        <div th:if="${path}" class="debug-info">
            Path: <span th:text="${path}"></span>
        </div>
    </div>
</body>
</html>
