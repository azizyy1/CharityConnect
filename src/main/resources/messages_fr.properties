about.title=À propos de CharityConnect
about.mission.title=Notre Mission
about.mission.text1=CharityConnect est une plateforme moderne conçue pour combler le fossé entre les donateurs compatissants et les organisations à but non lucratif percutantes. Notre mission est de faciliter des dons transparents, faciles et significatifs pour soutenir l'autonomisation des jeunes et le changement social dans le monde entier.
about.mission.text2=Nous croyons que chaque petite contribution peut mener à une différence significative. En offrant une interface sécurisée et intuitive, nous permettons à chacun de faire partie de la solution aux défis les plus pressants d'aujourd'hui.
about.role.donors.title=Pour les Donateurs
about.role.donors.text=Découvrez des causes vérifiées, suivez votre impact et gérez vos contributions dans un tableau de bord personnel unique.
about.role.orgs.title=Pour les Organisations
about.role.orgs.text=Lancez des campagnes, gérez les bénévoles et atteignez une communauté plus large de sympathisants pour alimenter votre mission.
about.role.transparency.title=Transparence
about.role.transparency.text=Le suivi des progrès en temps réel et le statut vérifié de l'organisation garantissent que chaque dirham va là où il est nécessaire.

