footer.about.text=Chez CharityConnect, nous nous tenons aux côtés des oubliés et des mal-servis. Grâce à des projets communautaires, des aides d'urgence et un soutien à long terme, nous visons à restaurer l'espoir là où il est le plus nécessaire.
